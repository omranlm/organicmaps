# Shared place links (not deployed yet): add inside the organicmaps.openstreetmap.sy server block,
# next to the existing /api/, /admin/, /mapdata/ and /apps/ locations, then `nginx -t` and reload.
# Copy l/index.html and .well-known/assetlinks.json to /var/www/organicmaps-site first.

# Every https://organicmaps.openstreetmap.sy/l/<ge0 code>/<name> link shows the same landing page;
# the page reads the place from its own address.
location ^~ /l/ {
    try_files /l/index.html =404;
    add_header Cache-Control "no-cache";
}

# Android App Links: lets the app open /l/ links directly. Must be served as JSON, without redirects.
location = /.well-known/assetlinks.json {
    default_type application/json;
    add_header Cache-Control "max-age=3600";
}
